<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자리비움 | 운영진</title><link rel="stylesheet" href="style.css"><style>
body{background:#f1f1f1}.top{background:white;border-bottom:1px solid #ddd}.top-inner{max-width:1280px;margin:auto;height:84px;display:flex;align-items:center;justify-content:space-between}.top img{width:275px}.container{max-width:1280px;margin:36px auto}.eyebrow{font-size:13px;color:#666}.heading{font-size:30px;margin:8px 0 28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:white;padding:26px;border:1px solid #e1e1e1}.stat strong{display:block;font-size:32px}.stat span{font-size:13px;color:#666}.tabs{display:flex;gap:24px;border-bottom:1px solid #ccc;margin:36px 0 20px}.tabs button{border:0;background:none;padding:15px 4px}.tabs button.active{border-bottom:3px solid #2591B8;color:#2591B8;font-weight:700}.panel{background:white;padding:28px;border:1px solid #e1e1e1}.panel h2{margin:0 0 20px;font-size:22px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:16px 12px;font-size:14px}th{background:#f6f6f6}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select{padding:12px;border:1px solid #aaa;min-height:46px}.toolbar button{background:#2591B8;border:0;color:white;padding:12px 20px;min-height:46px}.notice{background:#fff;border-left:4px solid #2591B8;padding:18px;margin:0 0 22px;color:#555;font-size:14px;line-height:1.6}
