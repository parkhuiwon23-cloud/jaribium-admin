ption></select><label class="label">예상 부재 시간</label><select class="field" id="awayDuration" onchange="$('customWrap').classList.toggle('hide',this.value!=='other')"><option value="10">10분</option><option value="30">30분</option><option value="60">1시간</option><option value="120">2시간</option><option value="other">기타 직접 입력</option></select><div id="customWrap" class="hide"><label class="label">직접 입력 (분)</label><input id="customDuration" class="field" type="number" min="1" step="1" placeholder="예: 180"></div><label class="label">인수인계 메모 (선택)</label><textarea class="field" id="awayMemo" rows="4" placeholder="작품 관리 시 주의사항을 입력해 주세요."></textarea><div class="spacer"></div><button class="button" onclick="registerAway()">자리비움 등록</button><p class="hint" id="awayError" style="color:#c32727;margin-top:12px"></p></section>`}function registerAway(){let duration=$('awayDuration').value;let n=duration==='other'?Number($('customDuration').value):Number(duration);if(!Number.isInteger(n)||n<1){$('awayError').textContent='예상 부재 시간을 1분 이상 입력해 주세요.';return}data.statuses[current.id]={type:'away',reason:$('awayReason').value,minutes:n,memo:$('awayMemo').value,at:new Date().toISOString()};save();showPage('home')}function returnToVenue(){data.statuses[current.id]={type:'present',at:new Date().toISOString()};save();showPage('home')}function works(){return `<section class="section"><h2>작품 관리</h2><p class="hint">작품 조작은 제작자에게 문의해 주세요.<br>공용 시설은 졸전위가 관리합니다.</p></section><section class="section"><h3>내 작품 <span style="color:#2591B8">${current.works.length}개</span></h3>${current.works.map(w=>`<div class="line"><div><div class="work-name">${esc(w)}</div><div class="mini muted" style="margin-top:5px">${esc(current.team)} ${esc(current.name)}</div></div>${statusHtml(current.id)}</div>`).join('')}</section><button class="button" onclick="alert('전시장 지도는 다음 버전에서 실제 도면과 연결됩니다.')">전시장 지도 보기</button>`}function issues(){let own=data.issues.filter(i=>i.owner===current.id||i.reporter===current.id);return `<section class="section"><h2>현장 이슈</h2><p class="hint">작품 문제는 제작자에게,<br>공용 시설 문제는 졸전위에 연락해 주세요.</p></section><section class="section"><label class="label">문제 발생 위치</label><select class="field" id="issueLocation"><option value="공용 공간">공용 공간</option>${current.works.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select><label class="label">문제 유형</label><select class="field" id="issueType"><option>영상 오류</option><option>시연 기기 문제</option><option>전시물 파손</option><option>안내 및 동선</option><option>기타</option></select><label class="label">상세 내용</label><textarea id="issueDetail" class="field" rows="5" placeholder="어떤 문제가 발생했나요?"></textarea></section><button class="button" onclick="registerIssue()">이슈 등록</button><section class="section"><h3>접수 내역</h3>${own.length?own.slice().reverse().map(i=>`<div class="line"><div><strong>${esc(i.location)}</strong><p class="hint">${esc(i.type)} ${esc(i.detail)}</p></div><span class="mini blue">${esc(i.state)}</span></div>`).join(''):'<p class="hint" style="text-align:center;padding:20px 0">등록된 이슈가 없습니다.</p>'}</section>`}function registerIssue(){let detail=$('issueDetail').value.trim();if(!detail){alert('상세 내용을 입력해 주세요.');return}let location=$('issueLocation').value;data.issues.push({id:Date.now(),location,type:$('issueType').value,detail,owner:location==='공용 공간'?null:current.id,reporter:current.id,state:'접수'});save();showPage('issues')}function schedules(){return `<section class="section"><h2>행사 일정</h2><p class="hint">날짜를 선택하면 세부 타임테이블을 확인할 수 있습니다.</p></section><section class="section">${schedule.map((d,i)=>`<div class="line"><div><strong>${d.date}</strong><div class="mini muted" style="margin-top:6px">${d.name}</div></div><button class="link" onclick="selectedDay=${i};showPage('day')">상세 보기 <span class="inline-arrow"><svg class="arrow-icon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg></span></button></div>`).join('')}</section>`}function dayDetail(i){let d=schedule[i];return `<button class="back" onclick="showPage('schedule')"><span class="back-arrow"><svg class="arrow-icon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg></span> 일정 목록</button><section class="section"><h2>${d.date}</h2><p class="hint">${d.name}</p></section><section class="section">${d.rows.map(r=>`<div style="padding:16px 0;border-bottom:1px solid #ddd"><div class="blue mini" style="margin-bottom:7px">${esc(r[0])}</div><strong>${esc(r[1])}</strong><p class="hint" style="margin-top:7px">${esc(r[2])}</p></div>`).join('')}</section>`}function adminTab(t){tab=t;renderAdmin()}function renderAdmin(){let present=PEOPLE.filter(p=>statusOf(p.id).type==='present').length;let active=data.helpers.filter(h=>h.state==='active').length;$('stats').innerHTML=[[40,'전체 참여자'],[present,'전시장 내'],[40-present,'자리비움'],[active,'활동 중인 지원 인력']].map(([v,l])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join('');document.querySelectorAll('#adminTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='people'){h=`<div class="admin-toolbar"><h2>참여자 현황</h2><input id="peopleSearch" placeholder="이름·학번·팀 검색" oninput="renderPeopleTable()"></div><div id="peopleTable"></div>`}if(tab==='works'){h=`<h2>작품별 담당자</h2><p class="admin-note">작품은 제작자 본인이 관리합니다. 팀 작품은 복수 담당자 조회가 가능합니다.</p><div class="admin-toolbar"><input id="workSearch" placeholder="작품·제작자 검색" oninput="renderWorkTable()"></div><div id="workTable"></div>`}if(tab==='issues'){h=`<h2>현장 이슈</h2><table class="work-table"><thead><tr><th>위치</th><th>유형</th><th>상세 내용</th><th>신고자</th><th>상태</th></tr></thead><tbody>${data.issues.map(i=>`<tr><td>${esc(i.location)}</td><td>${esc(i.type)}</td><td>${esc(i.detail)}</td><td>${esc(PEOPLE.find(p=>p.id===i.reporter)?.name||'')}</td><td><select class="admin-select" onchange="changeIssue(${i.id},this.value)">${['접수','확인 중','해결 완료'].map(s=>`<option ${s===i.state?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5">등록된 이슈가 없습니다.</td></tr>'}</tbody></table>`}if(tab==='helpers'){h=`<h2>일시 지원 인력</h2><p class="admin-note">정규 전시 참여자 40명과 별도로 집계합니다. 등록·상태 변경은 이 브라우저에 즉시 반영됩니다.</p><div class="helper-form"><input id="helperName" placeholder="이름"><select id="helperGroup"><option>학생회</option><option>학과 후배</option><option>기타</option></select><select id="helperZone"><option>입구 안내</option><option>멀티 전시</option><option>영상 전시</option><option>창업캡스톤</option><option>공용 공간</option><option>설치·철거</option></select><button onclick="addHelper()">인력 추가</button></div><table class="work-table"><thead><tr><th>이름</th><th>소속</th><th>지원 구역</th><th>상태</th></tr></thead><tbody>${data.helpers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.group)}</td><td>${esc(x.zone)}</td><td><select class="admin-select" onchange="changeHelper(${x.id},this.value)">${['활동 중','휴식 중','지원 종료'].map(s=>`<option ${s===x.state?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="4">등록된 지원 인력이 없습니다.</td></tr>'}</tbody></table>`}if(tab==='schedule'){h=`<h2>행사 일정</h2><div class="admin-toolbar"><select onchange="selectedDay=Number(this.value);renderAdmin()">${schedule.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${d.date}</option>`).join('')}</select></div><table class="work-table"><thead><tr><th>시간</th><th>진행 내용</th><th>세부 확인 사항</th></tr></thead><tbody>${schedule[selectedDay].rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`}$('adminContent').innerHTML=h;if(tab==='people')renderPeopleTable();if(tab==='works')renderWorkTable()}function renderPeopleTable(){let q=($('peopleSearch')?.value||'').trim().toLowerCase();let ps=PEOPLE.filter(p=>(p.name+p.id+p.team+p.major).toLowerCase().includes(q));$('peopleTable').innerHTML=`<table class="work-table"><thead><tr><th>이름</th><th>학번</th><th>전공</th><th>팀</th><th>상태</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.id)}</td><td>${esc(p.major)}</td><td>${esc(p.team)}</td><td>${statusHtml(p.id)}</td></tr>`).join('')}</tbody></table>`}function renderWorkTable(){let q=($('workSearch')?.value||'').trim().toLowerCase();let map=new Map();PEOPLE.forEach(p=>p.works.forEach(w=>{let k=w+'|'+p.team;if(!map.has(k))map.set(k,{work:w,team:p.team,owners:[]});map.get(k).owners.push(p)}));let items=[...map.values()].filter(x=>(x.work+x.team+x.owners.map(p=>p.name).join('')).toLowerCase().includes(q));$('workTable').innerHTML=`<table class="work-table"><thead><tr><th>작품</th><th>전시 팀</th><th>담당자</th><th>현재 상태</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.work)}</td><td>${esc(x.team)}</td><td>${x.owners.map(p=>esc(p.name)).join(', ')}</td><td>${x.owners.map(p=>esc(p.name)+' '+(statusOf(p.id).type==='present'?'현장':'부재')).join(' / ')}</td></tr>`).join('')}</tbody></table>`}function changeIssue(id,state){let x=data.issues.find(x=>x.id===id);if(x)x.state=state;save()}function addHelper(){let name=$('helperName').value.trim();if(!name){alert('이름을 입력해 주세요.');return}data.helpers.push({id:Date.now(),name,group:$('helperGroup').value,zone:$('helperZone').value,state:'활동 중'});save();renderAdmin()}function changeHelper(id,state){let x=data.helpers.find(x=>x.id===id);if(x)x.state=state;save();renderAdmin()}document.body.classList.add('admin-mode');renderAdmin();
</script></body></html>
